server:
  port: 3000

spring:
  # Включаем виртуальные потоки (Project Loom)
  threads:
    virtual:
      enabled: true


  # Настройки базы данных
  # Креды совпадают с docker-compose.yml (решение №7: секреты пока не выносим в env)
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: daniilnovikov
    password: demo2228
    driver-class-name: org.postgresql.Driver
    hikari:
      # Критически важно для виртуальных потоков (см. комментарий наставника)
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 3000

  # Настройки Hibernate
  jpa:
    hibernate:
      # Строго validate! Мы управляем схемой через Liquibase
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        # Обязательно под правило "только Instant": JDBC пишет и читает в UTC,
        # иначе таймзона JVM протечёт в TIMESTAMPTZ
        jdbc:
          time_zone: UTC
        # Схема монолита (решение №8) — @Table(schema=...) в сущностях можно не дублировать
        default_schema: market_place
    # Включай show-sql: true локально только для дебага
    show-sql: false

  # Миграции
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    # Схему market_place создаёт сам changelog (00-schema.sql), поэтому
    # служебные таблицы Liquibase держим в public — иначе курица и яйцо
    liquibase-schema: public

  # Redis (кэш каталога + Pub/Sub для событий Keycloak и чата)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # Безопасность (Keycloak — SSOT для аутентификации и ролей)
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URL:http://localhost:8080/realms/market-realm}

# Resilience4j (Базовый Rate Limiter для защиты от DDoS)
resilience4j:
  ratelimiter:
    instances:
      default:
        limitForPeriod: 100
        limitRefreshPeriod: 1s

# Observability (Открываем эндпоинты для Prometheus)
management:
  endpoints:
    web:
      exposure:
        include: health, metrics, prometheus
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    liquibase: INFO

marketplace:
  account:
    seller-application:
      hold: PT3M
  keycloak:
    # Канал Redis Pub/Sub, куда Keycloak SPI публикует USER_UPDATED (сценарий 2)
    events-channel: ${KEYCLOAK_EVENTS_CHANNEL:keycloak.events.user}
    # Общий секрет SPI ↔ listener. Не identity Redis: requirepass не заменяет HMAC.
    events-mac-secret: ${KEYCLOAK_EVENTS_MAC_SECRET:marketplace-dev-events-mac}
    events-mac-skew: ${KEYCLOAK_EVENTS_MAC_SKEW:30s}

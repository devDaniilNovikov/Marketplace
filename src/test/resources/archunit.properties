# Часть правил нарушена кодом, написанным до их введения (см. MEMORY.md, решение №2:
# "чиним по ходу"). FreezingArchRule записывает нарушения в стор и пропускает их,
# но валит сборку на любом новом. Стор — список техдолга, только уменьшается.
#
# Путь задан явно: по умолчанию ArchUnit кладёт стор в cwd JVM (корень проекта),
# где он не попадал в git — на чистом клоне нарушения замораживались заново.
freeze.store.default.path=src/test/resources/archunit_store
freeze.store.default.allowStoreCreation=true
freeze.store.default.allowStoreUpdate=true

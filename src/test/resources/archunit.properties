# FreezingArchRule пропускает нарушения, записанные в archunit_store, но валит сборку
# на ЛЮБОМ новом. Файлы стора — видимый список техдолга: он должен только уменьшаться
# по мере выполнения задач B1-B6 и никогда не расти.
#
# Сейчас в сторе восемь нарушений — это ровно задача B1 из .agents/TASKS.md:
# AccountEntity, OrderEntity и ProductEntity лежат в публичном api вместо entity,
# AccountRepository — в api.repository вместо repository, и все они public.
#
# Стор ЗАКОММИЧЕН, allowStoreCreation=false. Это значит: пропажа стора — ошибка
# сборки, а новое нарушение изоляции валит CI. Гейт работает по-настоящему.
#
# Перегенерировать стор после исправления нарушения:
#   Actions -> ArchUnit Store -> Run workflow
# (workflow сам прогонит правила и закоммитит результат; локальный JDK 25 не нужен)

# Без этой строки ArchUnit кладёт стор в каталог archunit_store ОТНОСИТЕЛЬНО РАБОЧЕГО
# КАТАЛОГА JVM тестов, то есть в корень проекта, а не в ресурсы. Задаём явно, чтобы
# стор версионировался рядом с кодом и был виден в диффе.
freeze.store.default.path=src/test/resources/archunit_store

# Значение переопределяется на конкретный прогон (этим пользуется archunit-store.yml):
#   ./gradlew test -ParchunitAllowStoreCreation=true
# (проброс в форкнутую JVM тестов сделан в build.gradle.kts; -D на JVM Gradle не долетает)
freeze.store.default.allowStoreCreation=false

# Исправленное нарушение автоматически удаляется из стора и назад уже не пройдёт.
# Важно: в CI это изменение остаётся в рабочей копии и теряется. Починил нарушение —
# перегенерируй стор через workflow ArchUnit Store, иначе он так и будет его помнить.
freeze.store.default.allowStoreUpdate=true

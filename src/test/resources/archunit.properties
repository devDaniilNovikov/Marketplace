# ВНИМАНИЕ: сейчас этот гейт НЕ РАБОТАЕТ как задумано.
#
# Замысел: FreezingArchRule записывает существующие нарушения в
# src/test/resources/archunit_store и пропускает их, но валит сборку на ЛЮБОМ новом.
# Файлы стора — видимый список техдолга, он должен только уменьшаться по задачам B1-B6.
#
# Фактически: стор не закоммичен в репозиторий, а allowStoreCreation=true. Поэтому
# каждый свежий чекаут (и любой прогон в CI) создаёт стор с нуля и замораживает в нём
# в том числе НОВЫЕ нарушения. Правило не падает никогда.
#
# Как починить (два шага, см. docs/agent-loop.md):
#   1. Прогнать `./gradlew test --tests '*ArchitectureTest'` (Docker не нужен),
#      закоммитить появившийся src/test/resources/archunit_store.
#      В CI стор выгружается артефактом `archunit-store-<run_id>` джобом `full`.
#   2. Поставить здесь allowStoreCreation=false. После этого отсутствие стора —
#      ошибка сборки, а новое нарушение изоляции валит CI, как и задумано.
#
# Значение можно переопределить на конкретный прогон:
#   ./gradlew test -ParchunitAllowStoreCreation=false
# (проброс в форкнутую JVM тестов сделан в build.gradle.kts; -D на JVM Gradle не долетает)
freeze.store.default.allowStoreCreation=true

# Исправленное нарушение автоматически удаляется из стора и назад уже не пройдёт.
freeze.store.default.allowStoreUpdate=true

# Часть правил нарушена кодом, написанным до их введения (см. MEMORY.md, решение №2:
# "чиним по ходу"). FreezingArchRule записывает эти нарушения в src/test/resources/archunit_store
# и пропускает их, но валит сборку на ЛЮБОМ новом нарушении. Файлы стора — это видимый
# список техдолга: он должен только уменьшаться по мере выполнения задач B1-B6.
freeze.store.default.allowStoreCreation=true

# Исправленное нарушение автоматически удаляется из стора и назад уже не пройдёт.
freeze.store.default.allowStoreUpdate=true

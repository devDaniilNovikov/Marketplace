global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: marketplace
    metrics_path: /actuator/prometheus
    static_configs:
      # монолит поднимается на хосте (./gradlew bootRun), не в compose
      - targets: ["host.docker.internal:3000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
